server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (inherited by locations that define no cache headers;
  # locations WITH cache headers re-include this file to keep them)
  include /etc/nginx/conf.d/seo-headers.conf;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    image/svg+xml
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    font/woff
    font/woff2;

  # SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/conf.d/seo-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets — cache forever
  location /assets/ {
    include /etc/nginx/conf.d/seo-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Static images, fonts and long-lived files
  location ~* \.(png|jpe?g|webp|avif|gif|ico|svg|woff2?|ttf|otf|mp4|webm)$ {
    include /etc/nginx/conf.d/seo-headers.conf;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SEO-critical static files from the app bundle (not proxied to API)
  location = /robots.txt {
    include /etc/nginx/conf.d/seo-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /sitemap.xml {
    include /etc/nginx/conf.d/seo-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    default_type application/xml;
  }
  location = /og-default.png {
    include /etc/nginx/conf.d/seo-headers.conf;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Video hero — large, rarely changing
  location = /videos/hero-loop.mp4 {
    include /etc/nginx/conf.d/seo-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}